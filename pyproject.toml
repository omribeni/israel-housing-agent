[project]
name = "israel-housing-agent"
version = "0.1.0"
description = "Daily Israeli housing news agent — scrapes government sites, news, and Google News, then filters with Claude and delivers via Telegram"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "anthropic>=0.40",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
housing-agent = "src.main:main"
